<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact</title>
  <link rel="stylesheet" href="/css/admin.css">
  <script src="/owner/auth.js"></script>
</head>
<body>
  <button class="mobile-toggle" id="menu-btn">☰</button>
  <div class="admin-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand"><span id="side-shop">My Shop</span><small>Owner Panel</small></div>
      <a href="/owner/dashboard.html">🏠 Dashboard</a>
      <a href="/owner/about.html">✏️ About</a>
      <a href="/owner/services.html">✂️ Services</a>
      <a href="/owner/gallery.html">📸 Gallery</a>
      <a href="/owner/contact.html" class="active">📍 Contact</a>
      <a href="/owner/timings.html">🕐 Timings</a>
      <a href="/owner/themes.html">🎨 Themes</a>
      <a href="/owner/enquiries.html">📨 Enquiries</a>
      <a href="/owner/settings.html">⚙️ Settings</a>
      <a href="/" target="_blank">🌐 View Website</a>
      <div class="logout"><a href="#" id="logout-btn">🚪 Logout</a></div>
    </aside>
    <main class="main">
      <div class="page-header"><h1>Contact Details</h1></div>
      <div id="msg"></div>
      <div class="card">
        <div class="form-row">
          <div class="form-group"><label>Shop Name</label><input id="shopName"></div>
          <div class="form-group"><label>Owner Name</label><input id="ownerName"></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Phone</label><input id="phone"></div>
          <div class="form-group"><label>WhatsApp</label><input id="whatsapp" placeholder="+919876543210"></div>
        </div>
        <div class="form-group"><label>Email</label><input id="email" type="email"></div>
        <div class="form-group"><label>Address</label><textarea id="address" rows="2"></textarea></div>
        <div class="form-group"><label>Pincode</label><input id="pincode"></div>
        <div class="form-group"><label>Google Maps URL</label><input id="googleMapsUrl" placeholder="https://maps.google.com/..."></div>
        <div class="form-group"><label>Google Reviews URL</label><input id="googleReviewUrl" placeholder="https://g.page/r/..."></div>
        <div class="form-row">
          <div class="form-group"><label>Instagram</label><input id="instagram"></div>
          <div class="form-group"><label>Facebook</label><input id="facebook"></div>
        </div>
        <div class="form-group"><label>YouTube Channel URL</label><input id="youtube" placeholder="https://youtube.com/@yourchannel"></div>
        <div class="form-group"><label>YouTube Video URL (embed on website)</label><input id="youtubeVideoUrl" placeholder="https://www.youtube.com/watch?v=xxxxx"></div>
        <div class="form-group"><label>Logo</label><input type="file" id="logoFile" accept="image/*"><img id="logoPreview" style="max-height:60px;margin-top:8px;display:none"></div>
      </div>
      <button class="btn btn-primary" id="save-btn">Save Changes</button>
    </main>
  </div>
  <script>
    if (!ownerAuth.requireLoginPage()) { /* redirecting */ }
    document.getElementById('menu-btn').onclick = () => document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('logout-btn').onclick = (e) => { e.preventDefault(); ownerAuth.ownerLogout(); };
    const fields = ['shopName','ownerName','phone','whatsapp','email','address','pincode','googleMapsUrl','googleReviewUrl','instagram','facebook','youtube','youtubeVideoUrl'];
    async function load() {
      const res = await ownerAuth.ownerFetch('/api/owner/shop');
      const s = await res.json();
      document.getElementById('side-shop').textContent = s.shopName || '';
      fields.forEach(f => { const el = document.getElementById(f); if (el) el.value = s[f] || ''; });
      if (s.logo) { const i = document.getElementById('logoPreview'); i.src = s.logo; i.style.display = 'block'; }
    }
    document.getElementById('logoFile').onchange = async (e) => {
      if (!e.target.files[0]) return;
      const fd = new FormData(); fd.append('file', e.target.files[0]);
      const msg = document.getElementById('msg');
      try {
        const res = await ownerAuth.ownerFetch('/api/owner/upload/logo', { method: 'POST', body: fd, credentials: 'same-origin' });
        const d = await res.json();
        if (res.ok && d.url) {
          const i = document.getElementById('logoPreview'); i.src = d.url; i.style.display = 'block';
          if (msg) msg.innerHTML = '<div class="alert alert-success">Logo uploaded</div>';
        } else {
          if (msg) msg.innerHTML = '<div class="alert alert-error">' + (d.error || 'Upload failed') + '</div>';
        }
      } catch (err) {
        if (msg) msg.innerHTML = '<div class="alert alert-error">Network error</div>';
      }
    };
    document.getElementById('save-btn').onclick = async () => {
      const body = {};
      fields.forEach(f => body[f] = document.getElementById(f).value);
      const res = await ownerAuth.ownerFetch('/api/owner/shop', { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
      document.getElementById('msg').innerHTML = res.ok ? '<div class="alert alert-success">Saved! <a href="/?t=' + Date.now() + '" target="_blank">Open website</a></div>' : '<div class="alert alert-error">Failed — check login</div>';
    };
    load();
  </script>
</body>
</html>
